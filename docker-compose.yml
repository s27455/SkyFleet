# Standard local development database (PostgreSQL 17). The API, worker and frontend run natively
# for fast reloads. Host port 55432 -> container 5432, so it never collides with a PostgreSQL
# installed on Windows (which uses 5432). Data lives in the named volume `skyfleet-db`.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: skyfleet
      POSTGRES_PASSWORD: skyfleet # local-only development credential
      POSTGRES_DB: skyfleet
    ports:
      - "55432:5432"
    volumes:
      - skyfleet-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyfleet -d skyfleet"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  skyfleet-db:
