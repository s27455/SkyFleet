# Local development database only. The API, worker and frontend run natively
# for fast reloads. Not used by the application until Phase 3 (persistence).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: skyfleet
      POSTGRES_PASSWORD: skyfleet # local-only development credential
      POSTGRES_DB: skyfleet
    ports:
      - "5432:5432"
    volumes:
      - skyfleet-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyfleet -d skyfleet"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  skyfleet-db:
